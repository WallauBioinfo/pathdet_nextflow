name: pathdet_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - nextflow=24.10.5
  - python>=3.8
  - fastp
  - bbmap
  - seqkit
  - kraken2
  - pigz
  - bowtie2
  - hisat2
  - blast
  - krona
  - bwa
  - samtools
  - gawk
  # Novas ferramentas bioinformáticas adicionadas:
  - minimap2
  - bcftools
  - deeptools
  # Dependências Python exigidas pelos scripts bin/
  - pandas
  - ete3
  # Novas bibliotecas Python adicionadas (para diversity.py e spark.py):
  - matplotlib
  - pysam